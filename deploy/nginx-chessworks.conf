# /etc/nginx/sites-available/chessworks.pickandmake.com
# Reverse proxy for the ChessWorks API, sharing the droplet with BoardVoyage / PickAndMake.

server {
    listen 80;
    server_name chessworks.pickandmake.com;

    location /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5002/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is live, run: sudo certbot --nginx -d chessworks.pickandmake.com
# Certbot will rewrite this file to add the SSL server block and an HTTP->HTTPS redirect.
